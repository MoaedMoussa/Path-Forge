kind = "web"
previewPath = "/"
title = "PathForge"
version = "1.0.0"
id = "artifacts/pathforge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20727

[services.development]
run = "pnpm --filter @workspace/pathforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pathforge", "run", "build" ]
serve = "static"
publicDir = "artifacts/pathforge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20727"
BASE_PATH = "/"
